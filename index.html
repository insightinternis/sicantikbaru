<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SI CANTIK — RSUD RT. Notopuro Sidoarjo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f1f5f3;--sf:#fff;--ink:#14302b;--mu:#5b6f6a;--ac:#0e6b5c;--acs:#dcf0ea;--ln:#d6e1dd;--red:#b3261e;--redbg:#fde8e6;--amb:#8f5400;--ambbg:#fff0d4;--grn:#1b7a3d;--grnbg:#ddf2e3;--hd:#0c3d36;--gd:#b08a3e;--sh1:0 1px 2px rgba(12,61,54,.06),0 8px 24px rgba(12,61,54,.07);--sh2:0 14px 36px rgba(8,40,34,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1917;--sf:#16251f;--ink:#e4efeb;--mu:#98b0a9;--ac:#4cc3ac;--acs:#1c3a33;--ln:#2a423b;--red:#ff8f86;--redbg:#3d1d1a;--amb:#f2b45a;--ambbg:#3a2a0e;--grn:#7bd896;--grnbg:#17361f;--hd:#0a2a25;--gd:#d8b66c}}
    :root[data-theme="dark"]{--bg:#0e1917;--sf:#16251f;--ink:#e4efeb;--mu:#98b0a9;--ac:#4cc3ac;--acs:#1c3a33;--ln:#2a423b;--red:#ff8f86;--redbg:#3d1d1a;--amb:#f2b45a;--ambbg:#3a2a0e;--grn:#7bd896;--grnbg:#17361f;--hd:#0a2a25;--gd:#d8b66c}
    *{box-sizing:border-box}html,body{margin:0}
    body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
    .w{max-width:600px;margin:0 auto;padding:0 18px}
    h1,h2{font-family:"Cormorant Garamond",Georgia,serif;margin:0}
    header{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% -10%,color-mix(in srgb,var(--ac) 55%,transparent),transparent 60%),linear-gradient(165deg,var(--hd),color-mix(in srgb,var(--hd) 80%,#000));color:#eaf6f2;padding:26px 0 80px;border-radius:0 0 30px 30px;border-bottom:2px solid var(--gd)}
    header .w{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .rs{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gd);margin-bottom:8px}
    .rs::before{content:"";width:22px;height:1px;background:var(--gd)}
    header h1{font-size:40px;letter-spacing:.14em;font-weight:600;line-height:1.05}
    header p{margin:8px 0 0;font-size:12px;opacity:.88;max-width:32ch;line-height:1.4;letter-spacing:.03em}
    .gbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:8px 14px;font:500 13px "DM Sans";cursor:pointer;white-space:nowrap}
    .pc{display:flex;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;margin-top:-52px;box-shadow:var(--sh2)}
    .pc b{font-size:18px}.pc .r{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--mu);font-size:14px;margin-top:4px}
    .av{flex:none;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));color:var(--sf);display:grid;place-items:center;font:700 24px "Cormorant Garamond",serif;box-shadow:0 0 0 3px var(--sf),0 0 0 4.5px var(--gd)}.pi{min-width:0}
    .al{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:500}
    .al.y{background:var(--redbg);color:var(--red);border:1px solid var(--red)}.al.n{background:var(--grnbg);color:var(--grn)}
    main{padding-top:4px}
    h2{font-size:27px;margin:28px 0 10px;color:var(--ac);font-weight:600;line-height:1.15;letter-spacing:.01em}
    h2::after{content:"";display:block;width:34px;height:2px;background:var(--gd);margin-top:8px;border-radius:2px}
    .c{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px 20px;margin:12px 0;box-shadow:var(--sh1)}
    .f{display:flex;flex-direction:column;gap:2px;margin:0 0 10px}.f:last-child{margin:0}
    .f label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--mu)}
    .f .v{font-weight:500}
    input,select,textarea{width:100%;font:inherit;color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,var(--sf));border:1px solid var(--ln);border-radius:12px;padding:9px 11px;min-height:44px;transition:border-color .15s,box-shadow .15s}
    textarea{min-height:72px}
    input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
    .bd{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
    .bd.w1{background:var(--ambbg);color:var(--amb)}.bd.p1{background:var(--acs);color:var(--ac)}.bd.s1{background:var(--grnbg);color:var(--grn)}
    .it{display:flex;gap:12px;align-items:flex-start}.it>div{flex:1;min-width:0}
    .ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--ln);background:var(--bg);color:#fff;font-size:17px;line-height:1;cursor:default;padding:0}
    .ck.on{background:var(--ac);border-color:var(--ac)}.ck.ed{cursor:pointer}
    .ex{color:var(--mu);font-size:14px;margin-top:4px}.mt{font-size:13px;color:var(--grn)}
    .pg{height:10px;border-radius:6px;background:var(--acs);overflow:hidden;margin:10px 0 2px}.pg i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#8fe3cf))}
    .cur{box-shadow:inset 4px 0 0 var(--gd),var(--sh1);border-color:var(--ln)}
    .eb{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--ambbg),color-mix(in srgb,var(--ambbg) 70%,var(--sf)));color:var(--amb);padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--amb) 40%,transparent);padding-top:calc(8px + env(safe-area-inset-top,0px))}
    .eb .w{display:flex;gap:10px;align-items:center;font-size:14px}.eb input{min-height:36px;padding:4px 8px}
    .btn{border:1px solid var(--ac);background:var(--ac);color:var(--sf);border-radius:12px;padding:10px 14px;font:600 15px "DM Sans";cursor:pointer;min-height:44px;box-shadow:0 2px 8px color-mix(in srgb,var(--ac) 30%,transparent);transition:transform .12s,filter .15s}
    .btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.06)}
    .btn.o{background:none;color:var(--ac);box-shadow:none}.btn.d{background:none;color:var(--red);border-color:var(--red);padding:6px 10px;min-height:36px;font-size:13px;box-shadow:none}
    nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30;box-shadow:0 -6px 20px rgba(12,61,54,.06)}
    nav .w{display:flex;padding:0;overflow-x:auto}nav a{flex:1 0 auto;min-width:60px;text-align:center;padding:14px 8px;font-size:12.5px;color:var(--mu);text-decoration:none;font-weight:500;position:relative}
    nav a.on{color:var(--ac);font-weight:700}
    nav a.on::after{content:"";position:absolute;left:25%;right:25%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--gd)}
    .lg{max-width:420px;margin:-52px auto 0;padding:0 16px}.lg .c{padding:24px 22px;box-shadow:var(--sh2)}.er{color:var(--red);font-size:14px;min-height:20px}
    .ft{color:var(--mu);font-size:12px;text-align:center;margin:24px 0;letter-spacing:.04em}
    .tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{text-align:left;color:var(--mu);font-weight:700;padding:4px 6px 8px;border-bottom:1px solid var(--ln);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
    .tb td{padding:9px 6px;border-bottom:1px solid var(--ln)}.tb tr:last-child td{border:0}
    .tb tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--acs) 35%,transparent)}
    .scr{overflow-x:auto}.btn:disabled{opacity:.4;cursor:not-allowed}
    .fl{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}.fl li{line-height:1.4}
    .md{background:var(--acs);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);border-radius:14px;padding:8px 14px;font-size:13.5px;font-weight:500;text-align:center;margin:0 0 12px;letter-spacing:.01em}
    .mc{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;margin:12px 0;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--sh1);min-height:88px;transition:border-color .15s,box-shadow .15s,transform .12s}
    .mc:hover{border-color:var(--gd);box-shadow:var(--sh2)}
    .mc .ic{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,var(--acs),color-mix(in srgb,var(--acs) 60%,var(--ac)));border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);color:var(--ac);display:grid;place-items:center}
    .mc.n .ic{background:linear-gradient(145deg,var(--ambbg),color-mix(in srgb,var(--ambbg) 60%,var(--amb)));border-color:color-mix(in srgb,var(--amb) 30%,transparent);color:var(--amb)}
    .mc b{font-size:16.5px;display:block;margin-bottom:2px;letter-spacing:.01em}.mc span{color:var(--mu);font-size:13.5px;line-height:1.4;display:block}
    .mc .ar{flex:none;margin-left:auto;color:var(--gd);font-size:26px}
    .mc:active{transform:scale(.98)}
    .chip{display:inline-block;margin-top:10px;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);letter-spacing:.06em;text-transform:uppercase}
    .bk{background:none;border:0;color:var(--ac);font:500 15px "DM Sans",sans-serif;cursor:pointer;padding:8px 0;margin-bottom:6px;min-height:44px}
    .lgt{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;color:var(--ac);margin:4px 0 0;text-align:center;font-weight:600;letter-spacing:.01em}
    .lgs{text-align:center;color:var(--mu);font-size:14px;margin:2px 0 14px}
    
    /* Tombol Sinkronisasi Topbar */
    .sync-top-btn { background: var(--ac); color: #fff; border: 1px solid color-mix(in srgb,var(--ac) 70%,#000); padding: 7px 12px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 12px; display:flex; align-items:center; gap:5px; }
    .status-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #fee2e2; color: #991b1b; display:inline-block; margin-top:2px; }
    .status-pill.connected { background: #dcfce7; color: #166534; }

    /* Modal Sinkronisasi (Sesuai Gambar Referensi) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--sf); color: var(--ink); width: 100%; max-width: 440px; border-radius: 22px; padding: 24px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.25); border: 1px solid var(--ln); }
    .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; color: var(--mu); cursor: pointer; }
    .modal-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; margin: 0 0 12px; font-family:"Cormorant Garamond",Georgia,serif; color: var(--ac); }
    .modal-desc { font-size: 13.5px; color: var(--mu); line-height: 1.5; margin-bottom: 20px; }
    .dark-field { margin-bottom: 16px; }
    .dark-field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .dark-field input { width: 100%; background: #142220; color: #f8fafc; border: 2px solid #2dd4bf33; padding: 13px 14px; border-radius: 12px; font-size: 14px; outline: none; }
    .dark-field input:focus { border-color: #5eead4; box-shadow: 0 0 0 3px rgba(94,234,212,0.2); }
    .dark-field input::placeholder { color: #94a3b8; }
    .btn-save-sync { width: 100%; background: var(--ac); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    .btn-save-sync:hover { filter: brightness(1.08); }
    .btn-reset-sync { width: 100%; background: var(--ln); color: var(--ink); border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div id="app"></div>

  <!-- MODAL SINKRONISASI SUPABASE (PERSIS SEPERTI GAMBAR) -->
  <div id="syncModal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeSyncModal()">✕</button>
      <div class="modal-title">☁️ Sinkronisasi Antar HP</div>
      <p class="modal-desc">
        Perawat dan pasien membuka papan yang sama di HP berbeda. Gunakan <strong>Kode Papan</strong> yang sama di semua HP (contoh: <code>melati-bed3</code>).
      </p>

      <div class="dark-field">
        <label>Supabase Project URL</label>
        <input type="text" id="cfgUrl" placeholder="https://xxx.supabase.co" />
      </div>

      <div class="dark-field">
        <label>Anon (public) key</label>
        <input type="text" id="cfgKey" placeholder="eyJhbGci..." />
      </div>

      <div class="dark-field">
        <label>Kode Papan (unik untuk ruangan/pasien)</label>
        <input type="text" id="cfgKode" placeholder="misal: melati-bed3" />
      </div>

      <button class="btn-save-sync" onclick="simpanDanHubungkan()">Simpan & Hubungkan</button>
      <button class="btn-reset-sync" onclick="putuskanReset()">Putuskan / Reset</button>
    </div>
  </div>

  <script>
    const KEY="sicantik-v2";
    const TODAY=new Date();
    const DEF={
      p:{nama:"Tn. Budi Santoso",usia:"58",jk:"Laki-laki",reg:"00-12-34-56",rm:"RM-884213",kamar:"Melati 302",kelas:"Kelas 2",bed:"Bed 2",tlp:"0812-3456-7890",pj:"Ibu Sari (istri)",tgl:"1968-05-14"},
      dpjp:"dr. Andini Pratama, Sp.PD",konsulan:"dr. Raka Wijaya, Sp.JP (Jantung)\ndr. Lina Hartono, Sp.GK (Gizi Klinik)",
      perawat:{pagi:"NS. Siti, S.Kep",sore:"NS. Dewi, S.Kep",malam:"NS. Agus, S.Kep"},
      alergi:"Paracetamol, seafood",nurse:"NS. Siti, S.Kep",
      tindakan:[{n:"Darah lengkap",w:"06.00",s:"Selesai"},{n:"Rontgen thorax",w:"10.00",s:"Menunggu"},{n:"Hemodialisis",w:"13.00",s:"Dalam Proses"}],
      diet:[{n:"Diet Diabetes Mellitus (DM) 1700 kkal",on:true,e:"Membantu menstabilkan kadar gula darah dengan membatasi karbohidrat sederhana dan memperbanyak serat. Mohon tidak membawa makanan atau minuman manis dari luar rumah sakit."},{n:"Diet rendah garam",on:false,e:"Membantu mengendalikan tekanan darah dan penumpukan cairan."},{n:"Puasa",on:false,e:"Dilakukan sebelum tindakan atau pemeriksaan tertentu. Perawat akan memberi tahu jamnya."},{n:"Makanan lunak saring (MSS)",on:false,e:"Makanan halus agar mudah ditelan dan dicerna."}],
      dietCat:"Pantangan: seafood. Tanyakan ke ahli gizi sebelum membawa makanan dari rumah.",
      edu:[{n:"Cuci tangan 8 langkah & etika batuk",e:"Cuci tangan dengan sabun atau handrub sebelum dan sesudah menyentuh pasien.",done:true,by:"NS. Siti, S.Kep",tgl:"2026-11-03"},{n:"Manajemen nyeri",e:"Menilai skala nyeri (1–10) dan teknik napas dalam. Jangan ragu memanggil perawat jika nyeri bertambah.",done:true,by:"NS. Siti, S.Kep",tgl:"2026-11-03"},{n:"Pencegahan risiko jatuh",e:"Pasang pagar pengaman tempat tidur, gunakan alas kaki anti-slip, dan minta bantuan keluarga saat pasien turun dari tempat tidur.",done:true,by:"NS. Siti, S.Kep",tgl:"2026-11-03"},{n:"Informasi obat (indikasi & efek samping)",e:"Kenali nama, fungsi, dan efek samping obat yang diberikan.",done:false},{n:"Pemberian nutrisi & batasan cairan",e:"Jumlah minum harian disesuaikan kondisi pasien.",done:false},{n:"Tata tertib rumah sakit, hak & kewajiban pasien",e:"Jam kunjung, jumlah penunggu, dan hak pasien.",done:false},{n:"Prosedur administrasi & pembiayaan",e:"Alur pembayaran dan berkas yang perlu disiapkan.",done:false},{n:"Perawatan alat medis terpasang (infus, NGT, dll.)",e:"Jaga alat tetap bersih dan tidak tertarik.",done:false},{n:"Mobilisasi bertahap di tempat tidur",e:"Miring kanan-kiri dan duduk bertahap sesuai arahan perawat.",done:false}],
      pulang:{tgl:"2026-11-05",siap:[{n:"Kondisi klinis & tanda vital stabil",done:false},{n:"Obat pulang & resep lanjutan",done:false},{n:"Edukasi perawatan mandiri di rumah",done:false},{n:"Jadwal kontrol ulang poli spesialis",done:false},{n:"Surat kontrol, surat izin pulang, resume medis",done:false}]}
    };

    let ALL=loadLocal(), S=ALL.pts[0], cur=S.id, myId=cur, myPin="", auth=false, edit=false, loginErr="", lm="", nLogin=false, rstAsk=false, nurseSess=false;
    
    // Supabase Integration Variables
    let supabaseClient = null;
    let realtimeChannel = null;
    let syncStatusText = "Belum Terhubung";

    {
      const sess = ss();
      if(sess) {
        const [i,p] = String(sess).split("|");
        const q = ALL.pts.find(x => x.id === +i);
        if(q && p && q.pin === p) { cur = myId = q.id; myPin = p; auth = true; }
      }
    }

    function loadLocal() {
      try { const r = localStorage.getItem(KEY); if(r) return norm(JSON.parse(r)); } catch(e){}
      return norm(null);
    }

    function norm(d) {
      if(d && d.pts && d.pts.length) { d.pin = d.pin || null; d.pts.forEach(x => x.pin = x.pin || genPin(d.pts)); return d; }
      const f = !(d && d.p), o = f ? JSON.parse(JSON.stringify(DEF)) : d;
      const r = { nurse: o.nurse || "", pin: null, pts: [Object.assign({id:1, status:"dirawat"}, o)] };
      if(f) {
        r.pts.push(demo(2,"Ny. Ratna Dewi","64","00-12-34-57","Melati 305","dr. Andini Pratama, Sp.PD","dirawat"));
        r.pts.push(demo(3,"Tn. Hadi Wibowo","71","00-12-34-58","Anggrek 201","dr. Raka Wijaya, Sp.JP","dirawat"));
        r.pts.push(demo(4,"Ny. Lestari","55","00-12-34-59","Mawar 110","dr. Andini Pratama, Sp.PD","pulang"));
      }
      r.pts.forEach(x => { x.pin = x.pin || genPin(r.pts); });
      return r;
    }

    function syncPt() {
      const f = ALL.pts.find(x => x.id === cur);
      S = f || ALL.pts[0];
      cur = S.id;
      if(!ALL.pts.some(x => x.id === myId)) myId = cur;
    }

    function genPin(l) { let p; do { p = String(Math.floor(100000 + Math.random() * 900000)); } while(l.some(x => x.pin === p)); return p; }
    function blank(id) {
      const d = JSON.parse(JSON.stringify(DEF)); d.id = id; d.status = "dirawat";
      d.p = {nama:"Pasien baru",usia:"",jk:"",reg:"",rm:"",kamar:"",kelas:"",bed:"",tlp:"",pj:"",tgl:""};
      d.dpjp=""; d.konsulan=""; d.perawat={pagi:"",sore:"",malam:""}; d.alergi="Tidak ada";
      d.tindakan=[]; d.diet.forEach(x => x.on = false); d.edu.forEach(x => {x.done=false; delete x.by; delete x.tgl});
      d.pulang.tgl=""; d.pulang.siap.forEach(x => x.done = false); d.dietCat=""; return d;
    }
    function demo(id,nama,usia,reg,kamar,dpjp,st) { const d = blank(id); Object.assign(d.p, {nama,usia,reg,kamar,bed:"Bed 1",kelas:"Kelas 2"}); d.dpjp=dpjp; d.status=st; d.pulang.tgl="2026-11-06"; return d; }

    let dbTimer = null;
    function save() {
      ALL.rev = Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(ALL)); } catch(e){}
      pushToSupabaseCloud();
      render();
    }

    async function pushToSupabaseCloud() {
      const kode = localStorage.getItem('sb_kode');
      if(!supabaseClient || !kode || !edit) return;
      clearTimeout(dbTimer);
      dbTimer = setTimeout(async () => {
        try {
          await supabaseClient.from('papan_pantau').upsert({
            kode_papan: kode,
            data_json: ALL,
            updated_at: new Date().toISOString()
          });
        } catch(e) { console.error("Gagal sinkron cloud:", e); }
      }, 400);
    }

    function ss(v) {
      try { if(v === undefined) return sessionStorage.getItem("sc-auth"); v ? sessionStorage.setItem("sc-auth", String(v)) : sessionStorage.removeItem("sc-auth"); } catch(e){}
    }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;"}[c]));
    const V = p => p.split(".").reduce((o,k) => o?.[k], S);
    function setP(p,v) { const k = p.split("."); let o = p === "nurse" ? ALL : S; for(let i=0; i<k.length-1; i++) o = o[k[i]]; o[k[k.length-1]] = v; save(); }
    const fmt = d => { if(!d) return "–"; const x = new Date(d+"T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}); };

    function fld(p,l,t="text",multi) {
      const v = V(p);

      return `<div class="f"><label>${l}</label><div class="v">${t==="date" ? fmt(v) : esc(v).replace(/\n/g,"<br>") || "–"}</div></div>`;

    const add = (a,l) => edit ? `<button class="btn o" data-a="${a}" style="width:100%;margin-top:6px">${l}</button>` : "";

    function effTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); }
    function applyTheme(t) { document.documentElement.dataset.theme = t; try{ localStorage.setItem("sc-theme", t); }catch(e){} }
    try{ const t0 = localStorage.getItem("sc-theme"); if(t0) document.documentElement.dataset.theme = t0; }catch(e){}

    const TABS = [["ringkasan","Ringkasan"],["tim","Tim"],["tindakan","Tindakan"],["diet","Diet"],["edukasi","Edukasi"],["pulang","Pulang"]];
    const tabs = () => edit ? [["daftar","Pasien"],...TABS] : TABS;

    function patientCard() {
      const p = S.p;

      <div class="al ${S.alergi.trim()&&!/^tidak/i.test(S.alergi)?"y":"n"}"><span aria-hidden="true">${S.alergi.trim()&&!/^tidak/i.test(S.alergi)?"⚠":"✓"}</span><span>${S.alergi.trim()&&!/^tidak/i.test(S.alergi)?"Alergi: "+esc(S.alergi):"Tidak ada alergi"}</span></div>`;

    // Modal UI Controls
    function openSyncModal() {
      document.getElementById('cfgUrl').value = localStorage.getItem('sb_url') || '';
      document.getElementById('cfgKey').value = localStorage.getItem('sb_key') || '';
      document.getElementById('cfgKode').value = localStorage.getItem('sb_kode') || '';
      document.getElementById('syncModal').classList.add('show');
    }
    function closeSyncModal() { document.getElementById('syncModal').classList.remove('show'); }

    async function simpanDanHubungkan() {
      const url = document.getElementById('cfgUrl').value.trim();
      const key = document.getElementById('cfgKey').value.trim();
      const kode = document.getElementById('cfgKode').value.trim().toLowerCase();

      if(!url || !key || !kode) { alert("Harap isi Project URL, Anon Key, dan Kode Papan!"); return; }

      localStorage.setItem('sb_url', url);
      localStorage.setItem('sb_key', key);
      localStorage.setItem('sb_kode', kode);
      closeSyncModal();
      await initSupabaseConnection();
      render();
    }

    function putuskanReset() {
      localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key'); localStorage.removeItem('sb_kode');
      if(realtimeChannel && supabaseClient) supabaseClient.removeChannel(realtimeChannel);
      supabaseClient = null; syncStatusText = "Belum Terhubung";
      document.getElementById('cfgUrl').value = ''; document.getElementById('cfgKey').value = ''; document.getElementById('cfgKode').value = '';
      alert("Koneksi diputuskan & pengaturan direset.");
      render();
    }

    async function initSupabaseConnection() {
      const url = localStorage.getItem('sb_url');
      const key = localStorage.getItem('sb_key');
      const kode = localStorage.getItem('sb_kode');

      if(!url || !key || !kode) { syncStatusText = "Belum Terhubung"; return; }

      try {
        supabaseClient = window.supabase.createClient(url, key);
        const { data, error } = await supabaseClient.from('papan_pantau').select('data_json').eq('kode_papan', kode).maybeSingle();
        if(error) throw error;

        if(data && data.data_json) {
          ALL = norm(data.data_json);
          syncPt();
        } else {
          await supabaseClient.from('papan_pantau').upsert({ kode_papan: kode, data_json: ALL });
        }

        if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = supabaseClient.channel(`papan-${kode}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'papan_pantau', filter: `kode_papan=eq.${kode}` }, payload => {
            if(payload.new && payload.new.data_json) {
              const remoteRev = payload.new.data_json.rev || 0;
              if(remoteRev > (ALL.rev || 0)) {
                ALL = norm(payload.new.data_json);
                try { localStorage.setItem(KEY, JSON.stringify(ALL)); } catch(e){}
                syncPt();
                if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
              }
            }
          })
          .subscribe();

        syncStatusText = `Terhubung (${kode})`;
      } catch(err) {
        console.error(err);
        syncStatusText = "Gagal Terhubung";
      }
    }

    function vRingkasan() {

    document.addEventListener("click", e => {
      const g = id => e.target.closest("#"+id);
      if(g("thm")) { applyTheme(effTheme()==="dark"?"light":"dark"); render(); return; }
      const mb = e.target.closest("[data-m]"); if(mb) { lm = mb.dataset.m; loginErr=""; render(); return; }

        if(pt) { cur=myId=pt.id; myPin=pt.pin; auth=true; syncPt(); ss(pt.id+"|"+pt.pin); loginErr=""; } else { loginErr="PIN tidak cocok."; }
        render(); return;
      }
      const gb = e.target.closest("[data-g]"); if(gb) { const x = ALL.pts.find(q => q.id === +gb.dataset.g); x.pin = genPin(ALL.pts); save(); render(); return; }
      const ob = e.target.closest("[data-o]"); if(ob) { cur = +ob.dataset.o; syncPt(); location.hash="ringkasan"; render(); return; }
      const sb = e.target.closest("[data-s]"); if(sb) { const x = ALL.pts.find(q => q.id === +sb.dataset.s); x.status = x.status==="dirawat"?"pulang":"dirawat"; save(); render(); return; }
      if(g("np")) { const id = Math.max(...ALL.pts.map(x=>x.id))+1, nb = blank(id); nb.pin = genPin(ALL.pts); ALL.pts.push(nb); cur=id; syncPt(); save(); location.hash="ringkasan"; render(); return; }
      if(g("rst")) { rstAsk=true; render(); return; }
      if(g("rstN")) { rstAsk=false; render(); return; }
      if(g("rstY")) { ALL.pts = ALL.pts.filter(x => x.status==="dirawat"); if(!ALL.pts.length) ALL.pts.push(blank(1)); syncPt(); rstAsk=false; save(); render(); return; }
      if(g("out")) { lm=""; auth=false; ss(false); edit=false; nurseSess=false; render(); return; }
      if(g("xit")) { edit=false; if(nurseSess) { lm=""; nurseSess=false; auth=false; ss(false); } else { cur=myId; syncPt(); } render(); return; }

      const t = e.target.closest("[data-t]");
      if(t) {
        const p = t.dataset.t, v = !V(p); setP(p,v);
        if(p.startsWith("edu.")) { const k = p.split("."), it = S.edu[k[1]]; if(v) { it.by = ALL.nurse; it.tgl = isoToday(); } else { delete it.by; delete it.tgl; } save(); }
        render(); return;
      }
      const a = e.target.closest("[data-a]");
      if(a) {
        const k = a.dataset.a;
        if(k==="tindakan") S.tindakan.push({n:"Pemeriksaan baru",w:"00.00",s:"Menunggu"});
        if(k==="diet") S.diet.push({n:"Diet baru",on:true,e:"Isi penjelasan."});
        if(k==="edu") S.edu.push({n:"Materi baru",e:"Isi penjelasan.",done:false});
        if(k==="pulang.siap") S.pulang.siap.push({n:"Persiapan baru",done:false});
        save(); render(); return;
      }
      const d = e.target.closest("[data-d]");
      if(d) { const [p,i] = d.dataset.d.split(":"); V(p).splice(+i,1); save(); render(); }
    });

    document.addEventListener("change", e => { if(!edit) return; const p = e.target.dataset?.p; if(p) { setP(p, e.target.value); } });
    document.addEventListener("keydown", e => {
      if(e.key==="Enter" && e.target.id==="lr") document.getElementById("lgo")?.click();
      if(e.key==="Enter" && e.target.id==="npin") document.getElementById("ngo")?.click();
    });
    window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

    // Auto-init Supabase jika kredensial sudah tersimpan di browser
    window.addEventListener("DOMContentLoaded", async () => {
      const url = localStorage.getItem('sb_url');
      const key = localStorage.getItem('sb_key');
      const kode = localStorage.getItem('sb_kode');
      if(url && key && kode) {
        await initSupabaseConnection();
      }
      render();
    });
  </script>
</body>
</html>
